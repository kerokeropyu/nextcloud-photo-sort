[project]
name = "nextcloud-photo-sort"
version = "0.1.0"
description = "NASの写真をローカルLLM(Ollama + Qwen2.5-VL)で分類し、Nextcloud Photosへ自動振り分けするツール"
readme = "README.md"
authors = [
    { name = "Kerokeropyu", email = "sharkxhu7@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.2",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
nextcloud-photo-sort = "nextcloud_photo_sort.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["nextcloud_photo_sort"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "ollama.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
